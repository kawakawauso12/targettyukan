/* ========================================
   ゲーム用変数
======================================== */

let currentList = [];

let currentQuestion = null;

let score = 0;

let answered = false;


/* ========================================
   シャッフル
======================================== */

function shuffle(array){

    let result = array.slice();

    for(let i=result.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        let temp=result[i];

        result[i]=result[j];

        result[j]=temp;
    }

    return result;
}


/* ========================================
   モード開始
======================================== */

function startGame(mode){

    if(mode === 1){

        currentList =
            questions.filter(function(q){
                return q.page === 1;
            });

    }

    else if(mode === 2){

        currentList =
            questions.filter(function(q){
                return q.page === 2;
            });

    }

    else{

        currentList =
            questions.slice();

    }


    score=0;

    document.getElementById("score").textContent=score;

    document.getElementById("menu").classList.add("hidden");

    document.getElementById("game").classList.remove("hidden");

    showQuestion();
}


/* ========================================
   問題表示
======================================== */

function showQuestion(){

    answered=false;

    currentQuestion =
        currentList[
            Math.floor(
                Math.random()*currentList.length
            )
        ];


    document.getElementById("questionNumber").textContent =
        "Target 1900 No."+currentQuestion.no;


    /* ★ 英文＋日本語訳を表示 */

    document.getElementById("question").innerHTML =
        currentQuestion.question
        +
        '<div class="japanese">'
        +
        currentQuestion.jp
        +
        '</div>';


    document.getElementById("hint").classList.add("hidden");

    document.getElementById("hint").textContent="";


    document.getElementById("result").classList.add("hidden");

    document.getElementById("result").innerHTML="";


    /*
       6択を作る
    */

    let otherAnswers =
        questions
        .map(function(q){
            return q.answer;
        })
        .filter(function(answer){
            return answer !== currentQuestion.answer;
        });


    otherAnswers =
        [...new Set(otherAnswers)];


    otherAnswers =
        shuffle(otherAnswers).slice(0,5);


    let choices =
        shuffle(
            [currentQuestion.answer]
            .concat(otherAnswers)
        );


    let choiceBox =
        document.getElementById("choices");


    choiceBox.innerHTML="";


    choices.forEach(function(choice,index){

        let button =
            document.createElement("button");


        button.className="choice";


        button.textContent =
            ["①","②","③","④","⑤","⑥"][index]
            +" "+choice;


        button.addEventListener(
            "click",
            function(){

                checkAnswer(
                    choice,
                    button
                );

            }
        );


        choiceBox.appendChild(button);

    });

}


/* ========================================
   答え確認
======================================== */

function checkAnswer(choice,button){

    if(answered){
        return;
    }


    answered=true;


    let buttons =
        document.querySelectorAll(".choice");


    buttons.forEach(function(btn){

        btn.disabled=true;

    });


    let result =
        document.getElementById("result");


    if(choice === currentQuestion.answer){

        score++;

        document.getElementById("score").textContent=score;


        result.innerHTML =
            "⭕ <strong>正解！！</strong><br><br>"
            +
            "<strong>【解説】</strong><br>"
            +
            currentQuestion.explanation;

    }

    else{

        result.innerHTML =
            "❌ <strong>不正解！</strong><br><br>"
            +
            "正解は <strong>"
            +
            currentQuestion.answer
            +
            "</strong><br><br>"
            +
            "<strong>【解説】</strong><br>"
            +
            currentQuestion.explanation;

    }


    result.classList.remove("hidden");

}


/* ========================================
   ヒント
======================================== */

function showHint(){

    if(!currentQuestion){
        return;
    }


    let hint =
        document.getElementById("hint");


    hint.innerHTML =
        "<strong>💡 日本語訳</strong><br>"
        +
        currentQuestion.jp;


    hint.classList.remove("hidden");

}

======================================== */

}
